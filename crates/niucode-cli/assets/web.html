<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>niucode · session</title>
<style>
:root { color-scheme:dark; --bg:#0d1117; --panel:#161b22; --text:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --err:#ff7b72; --border:#30363d; --panel2:#161b22; --code:#010409; }
body.light { color-scheme:light; --bg:#f6f8fa; --panel:#ffffff; --text:#1f2328; --dim:#59636e; --accent:#0969da; --err:#cf222e; --border:#d0d7de; --panel2:#eaeef2; --code:#f6f8fa; }
body.light aside { background:var(--panel2); }
body.light .approval { background:#fff8c5; }
body.light .diff-line.add { background:#dafbe1; color:#1a7f37; }
body.light .diff-line.remove { background:#ffebe9; color:#cf222e; }
body.light .tok-keyword { color:#cf222e; } body.light .tok-string { color:#0a3069; }
body.light .tok-number { color:#0550ae; } body.light .tok-function { color:#8250df; }
body.light .copy-code { background:#f6f8fa; }
body.contrast { color-scheme:dark; --bg:#000000; --panel:#000000; --text:#ffffff; --dim:#d0d0d0; --accent:#ffff00; --err:#ff5555; --border:#ffffff; --panel2:#111111; --code:#000000; }
body.contrast .msg.assistant { border-color:#ffff00; }
body.contrast .diff-line.add { background:#003300; color:#ffffff; }
body.contrast .diff-line.remove { background:#550000; color:#ffffff; }
body.contrast .tok-keyword { color:#ffff00; } body.contrast .tok-string { color:#00ffff; }
body.contrast .tok-number { color:#00ff00; } body.contrast .tok-function { color:#ff88ff; }
body.contrast .tool-card.ok summary, body.contrast .live.on { color:#00ff00; }
@media (prefers-reduced-motion: reduce) { * { animation-duration:0.01ms !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; } }
* { box-sizing: border-box; }
.skip { position:absolute; left:-9999px; top:0; z-index:10; background:var(--accent); color:var(--bg); padding:6px 10px; border-radius:0 0 6px 0; }
.skip:focus { left:0; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
header { position:sticky; top:0; z-index:2; background:var(--panel); border-bottom:1px solid var(--border); padding:12px 18px; display:flex; gap:12px; align-items:center; }
header b { color:var(--accent); }
main { max-width:900px; margin:0 auto; padding:24px 18px 140px; }
.log-tools { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
.log-tools input { max-width:280px; padding:6px 9px; font-size:12px; }
.log-tools span { color:var(--dim); font-size:11px; }
.search-focus { outline:1px solid var(--accent); border-radius:4px; }
aside { position:fixed; top:53px; bottom:70px; left:0; width:260px; overflow:auto; border-right:1px solid var(--border); padding:14px; background:var(--panel); display:none; }
aside h4 { margin:14px 0 4px; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
aside p { margin:2px 0; font-size:12px; color:var(--text); overflow-wrap:anywhere; white-space:pre-wrap; }
aside input { width:100%; margin:0 0 10px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 8px; font:12px ui-monospace,monospace; }
.ctx-section { border-bottom:1px solid var(--border); padding:4px 0; }
.ctx-section summary { cursor:pointer; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.08em; padding:4px 0; }
.ctx-section summary span { float:right; }
.thread-link { display:block; width:100%; text-align:left; background:none; border:0; border-radius:4px; color:var(--text); font:12px ui-monospace,monospace; padding:3px 4px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; }
.thread-link:hover { background:var(--panel2); color:var(--accent); }
.ctx-empty { color:var(--dim); font-size:12px; }
@media (min-width: 980px) { aside { display:block; } main { margin-left:280px; } footer { padding-left:280px; } }
#ctx-backdrop { display:none; }
@media (max-width: 979px) { aside { display:none; } aside.open { display:block; z-index:4; width:min(280px,85vw); box-shadow:8px 0 24px #0008; }
#ctx-backdrop:not([hidden]) { display:block; position:fixed; top:43px; left:0; right:0; bottom:0; z-index:3; background:#0008; }
}
.msg { position:relative; border-left:3px solid var(--border); padding:8px 14px; margin:14px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
.copy-message { position:absolute; top:4px; right:6px; border:1px solid var(--border); border-radius:5px; background:var(--panel2); color:var(--dim); font-size:10px; padding:1px 6px; cursor:pointer; opacity:0; }
.msg:hover .copy-message, .copy-message:focus { opacity:1; }
@media (max-width: 760px) { .copy-message { opacity:1; } }
.msg.user { border-color:var(--accent); }
.msg.assistant { border-color:#3fb950; }
.msg.assistant h1,.msg.assistant h2,.msg.assistant h3 { margin:12px 0 6px; line-height:1.25; }
.msg.assistant p { margin:8px 0; }
.msg.assistant ul,.msg.assistant ol { padding-left:22px; margin:8px 0; }
.msg.assistant input[type=checkbox] { margin-right:6px; vertical-align:middle; }
.msg.assistant .footnote-reference { font-size:11px; }
.msg.assistant .footnote-definition { color:var(--dim); font-size:13px; border-top:1px solid var(--border); margin-top:10px; padding-top:6px; }
.msg.assistant blockquote.markdown-alert-note { border-left-color:var(--accent); }
.msg.assistant blockquote.markdown-alert-tip { border-left-color:#3fb950; }
.msg.assistant blockquote.markdown-alert-warning { border-left-color:#d29922; }
.msg.assistant blockquote.markdown-alert-caution { border-left-color:var(--err); }
.msg.assistant blockquote[class^="markdown-alert"] { background:var(--panel2); padding:6px 10px; border-radius:0 6px 6px 0; }
.msg.assistant blockquote { border-left:3px solid var(--border); margin:8px 0; padding-left:12px; color:var(--dim); }
.msg.assistant table { border-collapse:collapse; margin:10px 0; display:block; overflow-x:auto; }
.msg.assistant th,.msg.assistant td { border:1px solid var(--border); padding:5px 9px; text-align:left; }
.msg.assistant th { background:var(--panel2); }
.msg.assistant pre { position:relative; background:var(--code); border:1px solid var(--border); border-radius:6px; padding:10px; overflow-x:auto; }
.tool-card pre, .preview pre { position:relative; }
.copy-code { position:absolute; top:6px; right:6px; padding:2px 7px; font-size:11px; border:1px solid var(--border); border-radius:5px; background:var(--panel2); color:var(--dim); cursor:pointer; opacity:.75; }
.copy-code:hover { opacity:1; color:var(--text); }
.cmd-menu { position:fixed; bottom:86px; left:50%; transform:translateX(-50%); width:min(900px,calc(100vw - 36px)); background:var(--panel); border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 28px #0008; overflow:hidden; z-index:5; }
.cmd-item { display:flex; gap:10px; padding:7px 12px; cursor:pointer; font:12px ui-monospace,monospace; }
.cmd-item:hover, .cmd-item.active { background:var(--border); }
.cmd-item b { color:var(--accent); min-width:80px; } .cmd-item span { color:var(--dim); }
.latest { position:fixed; right:18px; bottom:96px; z-index:4; border:1px solid var(--border); border-radius:999px; background:var(--panel); color:var(--text); padding:7px 12px; font-size:12px; cursor:pointer; box-shadow:0 4px 16px #0007; }
.msg.assistant code { background:var(--panel2); border-radius:4px; padding:1px 4px; }
.msg.assistant pre code { background:none; padding:0; }
.msg.assistant math { font-size:1.05em; }
.image-alt { color:var(--dim); font-style:italic; }
.tok-keyword { color:#ff7b72; } .tok-string { color:#a5d6ff; } .tok-comment { color:#8b949e; font-style:italic; }
.tok-number { color:#79c0ff; } .tok-function { color:#d2a8ff; }
.tool-card { border:1px solid var(--border); border-radius:6px; margin:8px 0; background:var(--bg); overflow:hidden; }
.tool-card summary { cursor:pointer; padding:6px 10px; color:var(--dim); font:12px/1.4 ui-monospace,monospace; }
.tool-card.ok summary { color:#3fb950; } .tool-card.err summary { color:var(--err); }
.tool-card pre { margin:0; padding:8px 10px; border-top:1px solid var(--border); color:var(--text); max-height:240px; overflow:auto; }
.msg.tool { border-color:#8b949e; color:var(--dim); font-family:ui-monospace,monospace; font-size:13px; white-space:pre-wrap; }
.meta { color:var(--dim); font-size:12px; margin:2px 0 6px; }
.live { margin-left:auto; color:var(--dim); font-size:12px; } .live.on { color:#3fb950; }
.chip { border:1px solid var(--border); border-radius:999px; padding:1px 8px; font-size:11px; color:var(--dim); white-space:nowrap; }
button.chip { background:var(--panel); color:var(--dim); font-weight:500; }
button.chip:hover { color:var(--text); border-color:var(--accent); }
#busy { color:var(--accent); }
#busy.working { border-color:var(--accent); }
aside.hidden { display:none !important; }
#toggle-context { cursor:pointer; background:none; }
#cwd { max-width:320px; overflow:hidden; text-overflow:ellipsis; }
@media (max-width: 760px) { #cwd, #mode, #download, #id, #live { display:none; } header { gap:8px; padding:10px 12px; } }
details { margin:8px 0; } summary { cursor:pointer; color:var(--dim); }
input,button { font:inherit; }
footer { position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid var(--border); padding:10px 18px; color:var(--dim); font-size:13px; }
form { display:flex; gap:8px; max-width:900px; margin:0 auto 8px; }
input, textarea { flex:1; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:9px 12px; outline:none; font:inherit; }
input:focus, textarea:focus { border-color:var(--accent); }
textarea { resize:none; min-height:42px; max-height:160px; overflow-y:auto; line-height:1.4; }
button { background:var(--accent); color:#07111f; border:0; border-radius:6px; padding:9px 16px; font-weight:600; cursor:pointer; }
button:disabled { opacity:.5; cursor:default; }
#status { max-width:900px; margin:0 auto; min-height:1.2em; }
#attachments { display:flex; flex-wrap:wrap; gap:6px; max-width:900px; margin:0 auto 6px; }
#attachments[hidden] { display:none; }
.attachment-chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:999px; background:var(--panel2); padding:3px 8px; font-size:12px; }
.attachment-chip button { background:transparent; color:var(--dim); border:0; padding:0 2px; font-weight:400; cursor:pointer; }
#attach { background:var(--panel2); color:var(--text); border:1px solid var(--border); padding:9px 12px; }
#file { display:none; }
code { font-family:ui-monospace,monospace; color:#79c0ff; }
.approval { border:1px solid #d29922; border-radius:8px; padding:12px; margin:14px 0; background:#1c1710; }
.approval h3 { margin:0 0 6px; color:#d29922; font-size:14px; }
.approval pre { white-space:pre-wrap; color:var(--dim); font-size:12px; }
.preview { border:1px solid var(--border); border-radius:6px; margin:8px 0; overflow:auto; max-height:360px; background:var(--bg); }
.diff-file { border-bottom:1px solid var(--border); }
.diff-head { padding:5px 8px; color:var(--dim); font-size:12px; background:var(--panel2); }
.diff-line { display:flex; gap:8px; font:12px/1.45 ui-monospace,monospace; white-space:pre; padding:0 8px; }
.diff-line.add { background:#12261a; color:#aff5b4; }
.diff-line.remove { background:#2d1214; color:#ffb3ba; }
.diff-num { color:#6e7681; min-width:3ch; text-align:right; user-select:none; }
.approval-shot { display:block; max-width:100%; max-height:320px; border:1px solid var(--border); border-radius:6px; margin:8px 0; image-rendering:auto; }
.approval button { margin-right:8px; } .deny { background:var(--panel2); color:var(--text); }
.allow-session { background:var(--panel2) !important; color:var(--accent) !important; border:1px solid var(--accent); }
</style>
</head>
<body>
<a class="skip" href="#log">Skip to transcript</a>
<header><button id="toggle-context" class="chip" title="Toggle context" aria-label="Toggle product context">☰</button><b id="brand">niucode</b><span id="model" class="chip">model…</span><span id="cwd" class="chip">cwd…</span><span id="mode" class="chip">policy…</span><button id="computer" class="chip" title="Arm or stop computer use">computer off</button><span id="busy" class="chip" aria-live="polite">idle</span><span id="usage" class="chip" title="token usage this page">0 tok</span><button id="theme" class="chip" title="Toggle theme: dark / light / high contrast" aria-label="Toggle theme">☾</button><button id="download" class="chip" title="download session Markdown" aria-label="Download session Markdown">Download</button><span id="id" class="meta">loading…</span><span id="live" class="live" aria-live="polite">○ connecting</span></header>
<div id="ctx-backdrop" hidden></div>
<aside id="context" aria-label="Product context"><input id="ctx-filter" placeholder="Filter context…" autocomplete="off" aria-label="Filter product context"><div id="ctx-body"><div class="ctx-empty">loading context…</div></div></aside>
<button id="latest" class="latest" hidden>↓ Latest</button><main><div class="log-tools"><input id="log-filter" placeholder="Search transcript… (Enter next, Shift+Enter prev)" autocomplete="off" aria-label="Search transcript"><button type="button" id="log-prev" class="chip" hidden title="Previous match (Shift+Enter)">↑</button><button type="button" id="log-next" class="chip" hidden title="Next match (Enter)">↓</button><span id="log-count"></span></div><div id="log" role="log" aria-live="polite" aria-label="Transcript"></div></main>
<footer><div id="attachments" hidden aria-label="Pending attachments"></div><form id="composer"><button type="button" id="attach" title="Attach image or text file" aria-label="Attach image or text file">Attach</button><input id="file" type="file" multiple accept="image/png,image/jpeg,image/webp,text/plain,.md,.rs,.py,.sh,.toml,.json"><textarea id="prompt" maxlength="100000" rows="1" autocomplete="off" placeholder="Ask for a task…" aria-label="Prompt"></textarea><button id="send">Send</button></form><div id="cmd-menu" hidden></div><div id="status">Enter to send · Shift+Enter for a newline · ↑ history · bind 127.0.0.1</div></footer>
<script>
const log = document.getElementById('log');
const id = document.getElementById('id');
const live = document.getElementById('live');
function node(tag, cls, text) { const e=document.createElement(tag); if(cls)e.className=cls; if(text)e.textContent=text; return e; }
function add(cls, text) { const d=node('div','msg '+cls,text); log.appendChild(d); return d; }
let count = 0, streaming = null, streamText = '', streamRendered = false;
let usageTotals = { input: 0, output: 0, cached: 0 };
function compactTokens(value) {
  if (value >= 1000000) return (value / 1000000).toFixed(1) + 'm';
  if (value >= 1000) return (value / 1000).toFixed(1) + 'k';
  return String(value);
}
function addUsage(usage) {
  usageTotals.input += usage.input_tokens || 0;
  usageTotals.output += usage.output_tokens || 0;
  usageTotals.cached += usage.cached_tokens || 0;
  const chip = document.getElementById('usage');
  const cachePct = usageTotals.input > 0 && usageTotals.cached > 0
    ? ' · ' + Math.floor(usageTotals.cached * 100 / usageTotals.input) + '% cache'
    : '';
  chip.textContent = compactTokens(usageTotals.input) + ' in / ' + compactTokens(usageTotals.output) + ' out' + cachePct;
  chip.title = usageTotals.cached + ' cached input tokens';
}
let turnStart = null, turnTimer = null, turnPhase = 'working';
function beginTurn(phase) {
  if (phase) turnPhase = phase;
  if (turnStart === null) {
    turnStart = Date.now();
    turnTimer = setInterval(() => {
      const elapsed = ((Date.now() - turnStart) / 1000).toFixed(1);
      document.getElementById('busy').textContent = turnPhase + ' ' + elapsed + 's';
    }, 200);
  }
  const busy = document.getElementById('busy');
  busy.textContent = turnPhase + ' 0.0s';
  busy.classList.add('working');
}
function endTurn() {
  if (turnTimer) { clearInterval(turnTimer); turnTimer = null; }
  const elapsed = turnStart === null ? 0 : (Date.now() - turnStart) / 1000;
  turnStart = null;
  const busy = document.getElementById('busy');
  busy.textContent = 'idle';
  busy.classList.remove('working');
  return elapsed.toFixed(1);
}
function atBottom() {
  return window.innerHeight + window.scrollY >= document.body.offsetHeight - 160;
}
function scrollToLatest() {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.scrollTo({ top: document.body.scrollHeight, behavior: reduce ? 'auto' : 'smooth' });
  document.getElementById('latest').hidden = true;
}
function updateLatest() {
  document.getElementById('latest').hidden = atBottom();
}
window.addEventListener('scroll', updateLatest, { passive: true });
document.getElementById('latest').onclick = scrollToLatest;
function render(e) {
  const follow = atBottom();
  setTimeout(() => { if (follow) scrollToLatest(); else updateLatest(); }, 0);
  count += 1;
  id.textContent = count + ' events';
  if (e.type === 'session_start') add('meta','session · '+e.cwd);
  else if (e.type === 'user_message') { const d = add('user', e.text); addMessageCopy(d, e.text); }
  else if (e.type === 'assistant_message') {
    if (streaming) {
      if (e.html) streaming.innerHTML = e.html; else streaming.textContent = e.text || streamText;
      addMessageCopy(streaming, e.text || streamText);
      streaming = null; streamText = ''; streamRendered = false; return;
    }
    const d = add('assistant', '');
    if (e.html) { d.innerHTML = e.html; addCopyButtons(d); } else d.textContent = e.text || '';
    addMessageCopy(d, e.text || d.innerText);
    if (e.tool_calls && e.tool_calls.length) {
      const det = node('details'); det.appendChild(node('summary',null,e.tool_calls.length+' tool call(s)'));
      for (const c of e.tool_calls) det.appendChild(node('div','meta',c.name+' '+JSON.stringify(c.input)));
      d.appendChild(det);
    }
  }
  else if (e.type === 'text_delta') {
    if (!streaming) { streaming = add('assistant',''); streamText = ''; streamRendered = false; }
    streamText += e.text || '';
    if (e.html) { streaming.innerHTML = e.html; streamRendered = true; }
    else if (!streamRendered) streaming.textContent = streamText;
  }
  else if (e.type === 'tool_call') renderToolCall(e);
  else if (e.type === 'tool_result') renderToolResult(e);
  else if (e.type === 'context_changed') loadContext();
  else if (e.type === 'session_switched') location.reload();
  else if (e.type === 'approval') { beginTurn('approval'); renderApproval(e); }
  else if (e.type === 'phase') { if (e.phase === 'done') endTurn(); else beginTurn(e.phase); }
  else if (e.type === 'turn_end') { const elapsed = endTurn(); addUsage(e.usage || {}); add('meta','turn · '+elapsed+'s · '+JSON.stringify(e.usage)); setTimeout(loadContext, 600); }
}
function addMessageCopy(element, raw) {
  const button = node('button','copy-message','Copy');
  button.onclick = async () => {
    try {
      await navigator.clipboard.writeText(raw || element.innerText);
      button.textContent = 'Copied';
      setTimeout(() => { button.textContent = 'Copy'; }, 1200);
    } catch (_) { button.textContent = 'Copy failed'; }
  };
  element.appendChild(button);
}

function addCopyButtons(root) {
  for (const pre of root.querySelectorAll('pre.code, pre.copyable')) {
    if (pre.querySelector('.copy-code')) continue;
    const code = pre.querySelector('code');
    if (!code) pre.dataset.copyText = pre.innerText;
    const button = node('button','copy-code','Copy');
    button.onclick = async () => {
      const text = code ? code.innerText : (pre.dataset.copyText || pre.innerText);
      try {
        await navigator.clipboard.writeText(text);
        button.textContent = 'Copied';
        setTimeout(() => { button.textContent = 'Copy'; }, 1200);
      } catch (_) { button.textContent = 'Copy failed'; }
    };
    pre.appendChild(button);
  }
}

function renderToolCall(e) {
  const card = node('details','tool-card');
  card.appendChild(node('summary',null,'→ '+e.name+' '+JSON.stringify(e.input||{}).slice(0,140)));
  if (e.input) {
    card.appendChild(node('pre','copyable',JSON.stringify(e.input,null,2)));
    addCopyButtons(card);
  }
  log.appendChild(card);
}
function renderToolResult(e) {
  const card = node('details','tool-card '+(e.ok?'ok':'err'));
  card.appendChild(node('summary',null,(e.ok?'✓ ':'✗ ')+(e.name||'tool')+' · '+(e.summary||'')));
  const pre = node('pre','copyable',e.output||e.summary||'');
  card.appendChild(pre);
  addCopyButtons(card);
  log.appendChild(card);
}

function renderPreview(preview) {
  const box = node('div','preview');
  if (!preview || !preview.body) { box.appendChild(node('div','meta','preview unavailable')); return box; }
  const body = preview.body;
  if (body.kind === 'command') {
    const pre = node('pre','copyable'); pre.textContent = body.command || ''; box.appendChild(pre); addCopyButtons(box); return box;
  }
  if (body.kind === 'note') { box.appendChild(node('div','meta', body.message || '')); return box; }
  if (body.kind !== 'diff') { box.appendChild(node('div','meta','preview unavailable')); return box; }
  let lines = 0;
  for (const file of body.files || []) {
    const section = node('div','diff-file');
    const head = node('div','diff-head');
    head.textContent = (file.is_new ? 'new ' : '') + file.path + '  +' + file.added + ' −' + file.removed;
    section.appendChild(head);
    for (const hunk of file.hunks || []) {
      for (const line of hunk.lines || []) {
        if (lines++ > 200) break;
        const row = node('div','diff-line ' + (line.kind || 'context'));
        const old = node('span','diff-num', line.old_line == null ? '' : String(line.old_line));
        const neu = node('span','diff-num', line.new_line == null ? '' : String(line.new_line));
        const mark = node('span',null, line.kind === 'add' ? '+' : line.kind === 'remove' ? '−' : ' ');
        const text = node('span',null,line.text || '');
        row.append(old, neu, mark, text); section.appendChild(row);
      }
    }
    box.appendChild(section);
  }
  if (preview.warning) box.appendChild(node('div','meta',preview.warning));
  return box;
}

function renderApproval(e) {
  const card = node('div','approval');
  card.appendChild(node('h3',null,'Approval · '+e.tool));
  card.appendChild(node('div','meta',e.summary || ''));
  if (typeof e.image === 'string' && e.image.startsWith('data:image/')) {
    const shot = node('img','approval-shot');
    shot.src = e.image;
    shot.alt = 'target window at observation time';
    shot.loading = 'lazy';
    card.appendChild(shot);
  }
  if (e.preview) card.appendChild(renderPreview(e.preview));
  const allow = node('button',null,'Allow');
  const always = node('button','allow-session','Allow tool');
  const deny = node('button','deny','Deny');
  let remaining = 300;
  const countdown = node('div','meta','expires in 5:00');
  const timer = setInterval(() => {
    remaining -= 1;
    const minutes = Math.floor(Math.max(remaining, 0) / 60);
    const seconds = String(Math.max(remaining, 0) % 60).padStart(2, '0');
    countdown.textContent = remaining > 0 ? 'expires in ' + minutes + ':' + seconds : 'approval expired';
    if (remaining <= 0) {
      clearInterval(timer);
      allow.disabled = always.disabled = deny.disabled = true;
    }
  }, 1000);
  const finish = async (allowed, session = false) => {
    clearInterval(timer);
    allow.disabled = always.disabled = deny.disabled = true;
    try {
      const r = await fetch('/api/approval', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:e.id, allowed, session})});
      if (!r.ok) throw new Error('approval failed');
      card.appendChild(node('div','meta', allowed ? (session ? 'allowed for this session' : 'allowed') : 'denied'));
    } catch (err) { card.appendChild(node('div','meta','error: '+err.message)); }
  };
  allow.onclick = () => finish(true); always.onclick = () => finish(true, true); deny.onclick = () => finish(false);

  log.appendChild(card);
}
async function refreshStatus() {

    document.getElementById('cwd').textContent = status.cwd || '';

        const data = await response.json();

refreshStatus(); setInterval(refreshStatus, 2500);
const CTX_KEY = 'niucode.context.collapsed';
function collapsedSections() {
  try { return JSON.parse(localStorage.getItem(CTX_KEY) || '{}'); } catch (_) { return {}; }
}
async function switchThread(id) {
  if (!confirm('Switch to ' + id + '? The current thread will be archived.')) return;
  try {
    const response = await fetch('/api/switch', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id}) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'switch failed');
    add('meta', 'switching to ' + id + ' · reloading');
    setTimeout(() => location.reload(), 400);
  } catch (error) { add('meta', 'switch: ' + error.message); }

async function loadContext() {
  try {
    const ctx = await fetch('/api/context').then(r=>r.json());
    if (ctx.brand) document.getElementById('brand').textContent = ctx.brand;
    if (ctx.title) document.title = ctx.title;
    const body = document.getElementById('ctx-body');
    body.textContent = '';
    if (!ctx.sections || !ctx.sections.length) {
      body.appendChild(node('div','ctx-empty','no product context'));
      return;
    }
    const collapsed = collapsedSections();
    for (const section of ctx.sections) {
      const title = section.title || '';
      const details = node('details','ctx-section');
      details.dataset.title = title;
      details.open = !collapsed[title];
      const summary = node('summary',null,title);
      summary.appendChild(node('span',null,String((section.lines || []).length)));
      details.appendChild(summary);
      for (const line of section.lines || []) {
      if (section.kind === 'threads') {
        const link = node('button','thread-link',line);
        link.onclick = () => switchThread(line);
        details.appendChild(link);
      } else {
        details.appendChild(node('p',null,line));
      }
    }
      details.addEventListener('toggle', () => {
        const state = collapsedSections();
        if (details.open) delete state[title]; else state[title] = true;
        try { localStorage.setItem(CTX_KEY, JSON.stringify(state)); } catch (_) {}
      });
      body.appendChild(details);
    }
    filterContext();
  } catch (_) {}
}
loadContext();
setInterval(loadContext, 15000);
let searchMatches = [], searchIndex = 0;
function updateSearchFocus(scroll = false) {
  for (const item of document.getElementById('log').children) item.classList.remove('search-focus');
  const query = document.getElementById('log-filter').value.trim();
  const prevBtn = document.getElementById('log-prev');
  const nextBtn = document.getElementById('log-next');
  const total = document.getElementById('log').children.length;
  prevBtn.hidden = nextBtn.hidden = !query || searchMatches.length < 2;
  if (!query) {
    document.getElementById('log-count').textContent = '';
    return;
  }
  if (!searchMatches.length) {
    document.getElementById('log-count').textContent = '0 / ' + total;
    return;
  }
  searchIndex = ((searchIndex % searchMatches.length) + searchMatches.length) % searchMatches.length;
  const target = searchMatches[searchIndex];
  target.classList.add('search-focus');
  if (scroll && target.scrollIntoView) target.scrollIntoView({ block: 'nearest' });
  document.getElementById('log-count').textContent = (searchIndex + 1) + ' of ' + searchMatches.length + ' (' + total + ')';
}
function stepTranscriptMatch(delta) {
  if (!searchMatches.length) return;
  searchIndex += delta;
  updateSearchFocus(true);
}
function filterTranscript() {
  const query = document.getElementById('log-filter').value.trim().toLowerCase();
  searchMatches = [];
  searchIndex = 0;
  for (const item of document.getElementById('log').children) {
    const match = !query || item.textContent.toLowerCase().includes(query);
    item.hidden = !match;
    if (query && match) searchMatches.push(item);
  }
  updateSearchFocus(false);
}
document.getElementById('log-filter').addEventListener('input', filterTranscript);
document.getElementById('log-prev').onclick = () => stepTranscriptMatch(-1);
document.getElementById('log-next').onclick = () => stepTranscriptMatch(1);
document.getElementById('log-filter').addEventListener('keydown', event => {
  if (event.key === 'Escape') { document.getElementById('log-filter').value = ''; filterTranscript(); }
  else if (event.key === 'Enter') { event.preventDefault(); stepTranscriptMatch(event.shiftKey ? -1 : 1); }
});
function filterContext() {
  const query = document.getElementById('ctx-filter').value.trim().toLowerCase();
  for (const section of document.querySelectorAll('.ctx-section')) {
    section.hidden = !!query && !section.textContent.toLowerCase().includes(query);
  }
}
document.getElementById('ctx-filter').addEventListener('input', filterContext);
const THEME_KEY = 'niucode.theme';
function applyTheme(theme, persist = true) {
  const light = theme === 'light';
  const contrast = theme === 'contrast';
  document.body.classList.toggle('light', light);
  document.body.classList.toggle('contrast', contrast);
  document.getElementById('theme').textContent = contrast ? '◐' : light ? '☀' : '☾';
  if (persist) { try { localStorage.setItem(THEME_KEY, theme); } catch (_) {} }
}
const savedTheme = localStorage.getItem(THEME_KEY);
if (savedTheme) {
  applyTheme(savedTheme);
} else if (window.matchMedia('(prefers-contrast: more)').matches) {
  applyTheme('contrast', false);
} else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
  applyTheme('light', false);
} else {
  applyTheme('dark', false);
}
document.getElementById('theme').onclick = () => {
  const current = document.body.classList.contains('light') ? 'light'
    : document.body.classList.contains('contrast') ? 'contrast' : 'dark';
  applyTheme(current === 'dark' ? 'light' : current === 'light' ? 'contrast' : 'dark');
};
async function downloadSession() {
  try {
    const response = await fetch('/api/export');
    if (!response.ok) throw new Error('export failed');
    const blob = await response.blob();
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'niucode-session.md';
    link.click();
    URL.revokeObjectURL(link.href);
    document.getElementById('status').textContent = 'session downloaded';
  } catch (error) { document.getElementById('status').textContent = 'export: ' + error.message; }
}
document.getElementById('download').onclick = downloadSession;
const ctxAside = document.getElementById('context');
const ctxBackdrop = document.getElementById('ctx-backdrop');
const ctxToggle = document.getElementById('toggle-context');
function setContextOpen(open) {
  ctxAside.classList.toggle('hidden', !open);
  ctxAside.classList.toggle('open', open);
  ctxBackdrop.hidden = !open;
  if (open) document.getElementById('ctx-filter').focus();
  else ctxToggle.focus();
}
ctxToggle.onclick = () => setContextOpen(getComputedStyle(ctxAside).display === 'none');
ctxBackdrop.onclick = () => setContextOpen(false);
function trapContextFocus(event) {
  if (event.key !== 'Tab' || ctxBackdrop.hidden) return;
  const items = [...ctxAside.querySelectorAll('input,button,summary,a[href]')]
    .filter(item => !item.disabled && item.getClientRects().length > 0);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
}
document.addEventListener('keydown', event => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
    event.preventDefault(); document.getElementById('log-filter').focus(); return;
  }
  if ((event.ctrlKey || event.metaKey) && event.key === '/') {
    event.preventDefault(); document.getElementById('prompt').focus(); return;
  }
  if (event.key === 'Tab') { trapContextFocus(event); return; }
  if (event.key === 'Escape') {
    if (!ctxBackdrop.hidden) { setContextOpen(false); return; }
    const filter = document.getElementById('log-filter');
    if (document.activeElement === filter) { filter.value = ''; filterTranscript(); }
    document.getElementById('cmd-menu').hidden = true;
  }
});
const source = new EventSource('/api/events');
source.onopen = () => { live.textContent = '● live'; live.className = 'live on'; };
source.onerror = () => { live.textContent = '○ reconnecting'; live.className = 'live'; };
source.onmessage = event => { try { render(JSON.parse(event.data)); } catch (_) {} };
const form = document.getElementById('composer');
const input = document.getElementById('prompt');
const send = document.getElementById('send');
const fileInput = document.getElementById('file');
const attachmentsBar = document.getElementById('attachments');
let pendingAttachments = [];
function renderAttachments() {
  attachmentsBar.textContent = '';
  attachmentsBar.hidden = pendingAttachments.length === 0;
  pendingAttachments.forEach((attachment, index) => {
    const chip = node('span', 'attachment-chip');
    chip.appendChild(document.createTextNode((attachment.kind === 'image' ? 'image' : 'text') + ' · ' + (attachment.name || attachment.sha256.slice(0, 8))));
    const remove = node('button', null, '×');
    remove.type = 'button';
    remove.title = 'Remove attachment';
    remove.onclick = () => { pendingAttachments.splice(index, 1); renderAttachments(); };
    chip.appendChild(remove);
    attachmentsBar.appendChild(chip);
  });
}
function readBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const value = String(reader.result || '');
      const comma = value.indexOf(',');
      resolve(comma >= 0 ? value.slice(comma + 1) : value);
    };
    reader.onerror = () => reject(reader.error || new Error('read failed'));
    reader.readAsDataURL(file);
  });
}
async function uploadAttachment(file) {
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { status.textContent = 'attachment too large: ' + file.name; return; }
  status.textContent = 'uploading ' + file.name + '…';
  try {
    const data = await readBase64(file);
    const response = await fetch('/api/attach', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:file.name, data}) });
    const ref = await response.json();
    if (!response.ok) throw new Error(ref.error || response.statusText);
    pendingAttachments.push(ref);
    renderAttachments();
    status.textContent = 'attached ' + (ref.name || file.name);
  } catch (error) { status.textContent = 'attach failed: ' + error.message; }
}
document.getElementById('attach').onclick = () => fileInput.click();
fileInput.onchange = async () => {
  const files = [...fileInput.files];
  fileInput.value = '';
  for (const file of files) await uploadAttachment(file);
};
form.addEventListener('dragover', event => { event.preventDefault(); });
form.addEventListener('drop', async event => {
  event.preventDefault();
  for (const file of [...(event.dataTransfer?.files || [])]) await uploadAttachment(file);
});
input.addEventListener('paste', async event => {
  const files = [...(event.clipboardData?.files || [])];
  if (!files.length) return;
  event.preventDefault();
  for (const file of files) await uploadAttachment(file);
});
const COMMANDS = [
  { name: '/help', description: 'list local commands' },
  { name: '/status', description: 'model, cwd, and policy' },
  { name: '/report', description: 'show the weekly report in context' },
  { name: '/threads', description: 'show archived threads in context' },
  { name: '/export', description: 'download the session Markdown' },
  { name: '/clear', description: 'clear the view only; session stays' },
  { name: 'Attach', description: 'button or drag/drop an image/text file' },
  { name: '/new', description: 'start a new session (reloads)' },
];
let commandItems = [], commandIndex = 0;
const HISTORY_KEY = 'niucode.prompt.history';
let history = [];
let historyIndex = -1;
try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch (_) { history = []; }
function rememberPrompt(prompt) {
  if (!prompt) return;
  history = [prompt, ...history.filter(item => item !== prompt)].slice(0, 50);
  historyIndex = -1;
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (_) {}
}
function recallHistory() {
  if (!history.length) return;
  if (historyIndex === -1) historyIndex = 0;
  else historyIndex = Math.min(historyIndex + 1, history.length - 1);
  input.value = history[historyIndex];
  growComposer();
}
function newerHistory() {
  if (historyIndex === -1) return;
  if (historyIndex === 0) { historyIndex = -1; input.value = ''; }
  else { historyIndex -= 1; input.value = history[historyIndex]; }
  growComposer();
}
function growComposer() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
}
input.addEventListener('input', () => { growComposer(); updateCommandMenu(); });
input.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  } else if (event.key === 'ArrowUp' && input.selectionStart === 0 && !input.value.includes('\n')) {
    event.preventDefault();
    recallHistory();
  } else if (event.key === 'ArrowDown' && historyIndex !== -1) {
    event.preventDefault();
    newerHistory();
  } else if (event.key === 'Tab' && commandItems.length) {
    event.preventDefault();
    fillCommand(commandItems[commandIndex].name);
  } else if (event.key === 'ArrowDown' && commandItems.length) {
    event.preventDefault();
    commandIndex = (commandIndex + 1) % commandItems.length;
    updateCommandMenu();
  } else if (event.key === 'ArrowUp' && commandItems.length) {
    event.preventDefault();
    commandIndex = (commandIndex - 1 + commandItems.length) % commandItems.length;
    updateCommandMenu();
  }
});
function updateCommandMenu() {
  const menu = document.getElementById('cmd-menu');
  const value = input.value;
  if (!value.startsWith('/') || value.includes(' ')) { menu.hidden = true; commandItems = []; return; }
  commandItems = COMMANDS.filter(command => command.name.startsWith(value));
  commandIndex = Math.min(commandIndex, Math.max(commandItems.length - 1, 0));
  menu.textContent = '';
  if (!commandItems.length) { menu.hidden = true; return; }
  commandItems.forEach((command, index) => {
    const item = node('div','cmd-item' + (index === commandIndex ? ' active' : ''));
    item.appendChild(node('b',null,command.name));
    item.appendChild(node('span',null,command.description));
    item.onclick = () => fillCommand(command.name);
    menu.appendChild(item);
  });
  menu.hidden = false;
}
function fillCommand(name) {
  input.value = name;
  document.getElementById('cmd-menu').hidden = true;
  input.focus();
  growComposer();
}
const status = document.getElementById('status');
form.onsubmit = async event => {
  event.preventDefault();
  const prompt = input.value.trim();
  if (!prompt) return;
  rememberPrompt(prompt);
  const command = prompt.split(/\s+/)[0];
  if (command === '/help') {
    add('meta','commands: /help · /status · /report · /threads · /export · /clear · /new · anything else goes to the agent');
    input.value = ''; growComposer(); status.textContent = 'local command'; return;
  }
  if (command === '/status') {
    try {
      const s = await fetch('/api/status').then(r => r.json());
      add('meta', 'model ' + (s.model || '?') + ' · ' + (s.cwd || '?') + ' · ' + (s.sandbox || '?') + ' / ' + (s.approval || '?') + ' · net ' + (s.network || '?') + ' · computer ' + ((s.computer || {}).policy || 'off'));
      input.value = ''; growComposer(); status.textContent = 'local command';
    } catch (error) { status.textContent = 'status failed: ' + error.message; }
    return;
  }
  if (command === '/report') {
    document.getElementById('ctx-filter').value = 'report';
    await loadContext();
    status.textContent = 'local command · report shown in context';
    input.value = ''; growComposer(); return;
  }
  if (command === '/threads') {
    document.getElementById('ctx-filter').value = 'threads';
    await loadContext();
    status.textContent = 'local command · threads shown in context';
    input.value = ''; growComposer(); return;
  }
  if (command === '/new') {
    try {
      const response = await fetch('/api/new', { method: 'POST' });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'new session failed');
      add('meta', 'new session ' + (data.id || '') + ' · reloading');
      input.value = ''; growComposer(); status.textContent = 'local command';
      setTimeout(() => location.reload(), 500);
    } catch (error) { add('meta', 'new session: ' + error.message); }
    return;
  }
  if (command === '/export') {
    await downloadSession();
    input.value = ''; growComposer(); status.textContent = 'local command'; return;
  }
  if (command === '/clear') {
    log.textContent = ''; streaming = null; streamText = ''; streamRendered = false;
    add('meta','view cleared · session log unchanged');
    input.value = ''; growComposer(); status.textContent = 'local command'; return;
  }
  if (command.startsWith('/')) {
    add('meta','unknown command ' + command + ' · /help');
    input.value = ''; growComposer(); status.textContent = 'local command'; return;

  send.disabled = true; status.textContent = 'sending…'; beginTurn('sending');
  try {
    const response = await fetch('/api/prompt', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt, attachments: pendingAttachments}) });
    const data = await response.json();

    pendingAttachments = []; renderAttachments();
    status.textContent = 'turn running…';
  } catch (error) { status.textContent = 'error: ' + error.message; }
  finally { send.disabled = false; }
};
